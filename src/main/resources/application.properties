org.eclipse.microprofile.rest.client.propagateHeaders=x-request-id

# Base URL for the local downstream echo service used by EchoClient.
quarkus.rest-client.echo.url=http://localhost:8080

quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=50

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) <%X{x-request-id}> %s%e%n
